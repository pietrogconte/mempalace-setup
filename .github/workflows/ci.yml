name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tomli (Python < 3.11 only)
        run: python -m pip install "tomli; python_version < '3.11'"
      - name: Tests (sync, normalizer, viewer core; fictitious data, no MemPalace)
        run: python -m unittest discover -s tests -t . -v
      - name: Byte-compile scripts and viewer
        run: python -m compileall -q scripts viewer
